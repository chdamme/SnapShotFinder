<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2x2 Grid Layout with Map</title>

    <style>

    </style>

    <link rel="stylesheet" href="stylesheet.css">
    <script src="https://apiv4.geoportail.lu/apiv4loader.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.2/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.5/proj4.js"></script>

</head>

<body>
    <div id="window0">
        <!-- Content for window0 -->
        <h1 id="title">SnapShotFinder</h1>
        <div id="buttons">
            <!--<button type="button">Button 1</button>-->
            <button type="button">SOS</button>
        </div>
    </div>
    
    <div class="grid-container">
        <div class="left-sidebar"></div>
        <div class="right-sidebar"></div>

        <div class="grid-item" id="window1">
            <div id="dropzone">Drop files here</div>
        </div>
        <div class="grid-item" id="window2"></div>
        <div class="grid-item" id="window3">
            <!-- Container for the map -->
            <div id="map3" style="height: 200px; width: 100%;"></div>
            <!-- Container for the layer manager -->
            <div id="layerManager3"></div>
            <!-- Container for the background selector -->
            <div id="bgMap3"></div>
        </div>
        <div class="grid-item" id="window4">
            <!-- Container for the map -->
            <div id="map4" style="height: 200px; width: 100%;"></div>
            <!-- Container for the layer manager -->
            <div id="layerManager4"></div>
            <!-- Container for the background selector -->
            <div id="bgMap4"></div>
        </div>
    </div>

    <script>
       
    </script>

    <script src="java.js"></script>
</body>
</html>
